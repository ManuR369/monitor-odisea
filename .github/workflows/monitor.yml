name: Monitor Dune IMAX

# APAGADO: ya se compraron las entradas. Solo corre a mano (Actions → Run
# workflow). Para reactivarlo, volver a agregar el cron y el paso que encola
# la siguiente corrida (ver historial de git).
on:
  workflow_dispatch: {}

concurrency:
  group: monitor-dune
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Chequear Dune cada 30 s
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          pip install -q requests
          python monitor_dune.py --loop 20400

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dune_avisadas.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Dune avisada" && git pull --rebase && git push)

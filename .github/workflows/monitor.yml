name: Monitor Dune IMAX

# Cada corrida chequea cada 30 s durante ~5h45m. El cron cada 30 min deja
# siempre una corrida en cola (concurrency) que arranca apenas termina la
# anterior, asi no hay huecos aunque GitHub atrase el cron.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-dune
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Chequear Dune cada 30 s
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q requests
          python monitor_dune.py --loop 20400

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dune_avisadas.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Dune avisada" && git pull --rebase && git push)
